[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "llm-multimodal-rag"
version = "0.1.0"
description = "Multimodal RAG system with LangChain"
requires-python = ">=3.12"
dependencies = [
    # LangChain ecosystem
    "langchain>=0.3.0",
    "langchain-core>=0.3.0",
    "langchain-community>=0.3.0",
    "langchain-openai>=0.2.0",
    "langchain-chroma>=0.1.4",
    "langchain-huggingface>=0.1.0",
    "langsmith>=0.1.0",
    # LLM providers
    "openai>=1.55.0",
    "cohere>=5.11.0",
    # Embeddings & ML
    "sentence-transformers>=3.3.0",
    "transformers>=4.46.0",
    "torch>=2.5.0",
    # Document processing
    "unstructured[all-docs]>=0.16.0",
    "pypdf>=4.0.0",
    "Pillow>=11.0.0",
    # VectorStore
    "chromadb>=0.5.0",
    # API
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "python-multipart>=0.0.12",
    "httpx>=0.28.0",
    "aiofiles>=24.1.0",
    # UI
    "streamlit>=1.40.0",
    # Config & Utils
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    "PyYAML>=6.0.0",
    "python-dotenv>=1.0.0",
    # Monitoring
    "prometheus-client>=0.21.0",
    # Evaluation
    "ragas>=0.2.0",
    "datasets>=3.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-mock>=3.14.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
