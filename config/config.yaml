llm:
  provider: openai          # openai | azure | ollama | huggingface
  model: gpt-4o
  temperature: 0.0
  max_tokens: 2048
  hf_mode: api              # api | local (nur für HuggingFace)
  azure_api_version: "2024-02-01"
  ollama_base_url: "http://localhost:11434"

embedding:
  provider: openai          # openai | huggingface
  model: text-embedding-3-large

vectorstore:
  provider: chroma
  persist_directory: ./data/vectorstore
  collection_name: multimodal_rag
  min_relevance_score: 0.35  # Chunks darunter werden nicht als Kontext verwendet
  image_min_relevance_score: 0.55  # Bilder nur bei klarer inhaltlicher Übereinstimmung
  chroma_host: ""           # leer = embedded (lokal); Hostname = HTTP-Client (Docker)
  chroma_port: 8000

reranker:
  enabled: true
  provider: crossencoder    # crossencoder | cohere
  model: cross-encoder/ms-marco-MiniLM-L-6-v2
  top_n: 5

retrieval:
  k: 20
  search_type: similarity   # similarity | mmr

monitoring:
  enabled: true
  prometheus_port: 8001

langsmith:
  enabled: false
  project: multimodal-rag

api:
  host: "127.0.0.1"
  port: 8000
  cors_origins: "http://localhost:8501,http://127.0.0.1:8501"
  max_upload_size_mb: 25

data_dir: ./data
documents_dir: ./data/documents
images_dir: ./data/images
logs_dir: ./logs
