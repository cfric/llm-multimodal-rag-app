name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Verify dependency consistency
        run: python -m pip check
      - name: Verify provider imports
        run: python -c "from langchain_ollama import ChatOllama; from langchain_text_splitters import RecursiveCharacterTextSplitter"
      - name: Lint
        run: python -m ruff check .
      - name: Type check
        run: python -m mypy src
      - name: Test
        run: PYTHONPATH=. python -m pytest tests/ -v
